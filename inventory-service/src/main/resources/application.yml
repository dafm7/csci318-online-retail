server:
  port: 8086
  error:
    include-message: always

inventory:
  low-stock-threshold: 10   # stock below this raises a LowStockAlert

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:h2:mem:inventoryservice
    username: sa
    password:
  cloud:
    function:
      definition: inventory
    stream:
      bindings:
        inventory-in-0:
          destination: stock-changed
        inventory-out-0:
          destination: low-stock-alerts
      kafka:
        streams:
          binder:
            brokers: localhost:9092
            application-id: inventory-service
            configuration:
              commit.interval.ms: 1000   # flush results every second (real-time demo)
