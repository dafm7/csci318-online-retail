server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentservice
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true      # http://localhost:8084/h2-console
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        processPayment-in-0:
          destination: order-placed
          group: payment-service
        processPayment-out-0:
          destination: payment-completed
