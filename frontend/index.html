<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Retail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Online Retail</h1></header>

  <main>
    <section>
      <h2>Products</h2>
      <div id="products">Loading...</div>
    </section>

    <section>
      <h2>Shopping Assistant</h2>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Ask about products or your order..." autocomplete="off">
        <button>Send</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
