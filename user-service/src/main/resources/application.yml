server:
  port: 8082
  error:
    include-message: always   # show e.g. "email already registered" in error responses

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userservice
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true      # http://localhost:8082/h2-console
  jackson:
    serialization:
      indent-output: true   # pretty-print JSON so it's readable in the terminal
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092

# Where the REST client in infrastructure/client finds order-service
services:
  order-url: http://localhost:8083

# Admin account created on startup (see infrastructure/persistence/DataLoader)
admin:
  email: admin@shop.com
  password: admin123
