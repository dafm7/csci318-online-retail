server:
  port: 8081
  error:
    include-message: always   # show e.g. "product not found" in error responses

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:mem:productservice
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true      # http://localhost:8081/h2-console
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        reduceStock-in-0:
          destination: order-placed
          group: product-service
        stockChanged-out-0:
          destination: stock-changed
