server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:mem:orderservice
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true      # http://localhost:8083/h2-console
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
      bindings:
        orderPlaced-out-0:
          destination: order-placed
        paymentCompleted-in-0:
          destination: payment-completed
          group: order-service
